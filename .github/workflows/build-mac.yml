name: Build macOS Application (Apple Silicon)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14  # Apple Silicon M-series runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow PyQt6 pyinstaller

      - name: Build macOS .app Bundle (Apple Silicon Only)
        run: |
          python -m PyInstaller \
            --windowed \
            --clean \
            --target-arch arm64 \
            --name="PC-98 STUDIO" \
            --exclude-module PyQt6.QtNetwork \
            --exclude-module PyQt6.QtQml \
            --exclude-module PyQt6.QtQuick \
            --exclude-module PyQt6.QtSql \
            --exclude-module PyQt6.QtPdf \
            --exclude-module PyQt6.QtTest \
            pc98_studio.py

      - name: Compress App Bundle
        run: |
          cd dist
          zip -r "PC-98-STUDIO-macOS-arm64.zip" "PC-98 STUDIO.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-98-STUDIO-macOS-arm64
          path: dist/PC-98-STUDIO-macOS-arm64.zip
